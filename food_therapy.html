五香粉 typically contains: star anise, fennel seed, cinnamon (cassia), Sichuan peppercorn, and cloves. Look at that list — we've now covered four of the five. This is the spice blend that flavors 五香牛肉 (five-spice beef), 五香花生 (five-spice peanuts), 五香豆干 (five-spice pressed tofu), and dozens of other dishes.

Fennel seed's specific food therapy job: warm the stomach, relieve cramping pain, and — this is very practical — reduce gas. If you're bloated and gassy after eating too many beans or lentils, fennel seed tea is the traditional Chinese (AND Italian AND Indian) solution. Three cultures, same plant, same use. When the entire world independently agrees that fennel helps with gas, it's probably not a coincidence.[cite: 2]`
  },
  {
    title: "Part 4: What Shanghai Eats in Spring",
    content: `If you're visiting in early May, you've arrived at one of the best eating moments of the Shanghai year. Winter is gone. The humidity hasn't hit its brutal summer peak yet. And the markets are exploding with fresh, seasonal ingredients that Shanghainese people wait for all year. Some of these things are available for only a few weeks. Miss the window, and you wait twelve months.

Chinese food therapy has a rule for spring and early summer: 清补 — "light nourishment." Don't eat heavy, greasy, warming foods. The weather is warming up. Your body is warming up. If you add more heat on top of that, you'll "overshoot the thermostat" — remember? — and get 上火 (overheating): pimples, sore throat, irritability, constipation. Instead, eat light. Eat green. Eat cool. Eat fresh.

Here's what's on the table right now.[cite: 2]`

  {
    title: "马兰头 — Indian Kalimeris",
    content: `This is the #1 spring vegetable of Shanghai, and if you don't try it, you haven't really been here in May.

马兰头拌香干 — blanched kalimeris shoots, chopped fine, mixed with tiny cubes of pressed tofu, dressed with sesame oil and a splash of soy sauce. That's it. Five ingredients. Takes ten minutes. And it's one of the most beloved cold dishes in Shanghai cuisine.

The taste: green, slightly bitter, slightly grassy, with a refreshing quality that's hard to describe — like eating the smell of a freshly mowed lawn, but in a good way. The pressed tofu adds a mild, creamy, protein-rich contrast. The sesame oil ties it together.

In food therapy terms, 马兰头 is cool and slightly bitter. Remember — bitter is the flavor that "drains downward," that clears heat. In spring, when the body's yang energy is rising, a cool, bitter vegetable keeps things from rising too fast. It's a gentle brake pedal for springtime overheating.

Shanghainese people are fiercely seasonal about this dish. It appears on menus in March and disappears by May. If you order it in August, people will look at you strangely. "That's not the season." This level of seasonal specificity — eating certain vegetables only in their natural window — is food therapy built into culture at the deepest level. You eat what the earth is offering RIGHT NOW, not what a greenhouse can force into existence twelve months a year.[cite: 2]`

    title: "羊肉 — Lamb / Mutton",
    content: `If there's one food that defines Chinese winter eating, it's this.

Shanghai in November has several iconic lamb dishes:

涮羊肉 — Mongolian-style lamb hotpot. Paper-thin slices of lamb, swished through boiling broth for a few seconds, dipped in sesame paste. This is social eating at its best — a group around a bubbling pot, talking, laughing, cooking together.

红烧羊肉 — red-braised lamb. Chunks of lamb slowly braised in soy sauce, rock sugar, star anise, cinnamon, ginger, and rice wine until the meat is falling off the bone and the sauce is thick and glossy. This is Shanghai comfort food. Rich, sweet, deeply warming.

糖醋藕片 — sweet-and-sour lotus root slices. Thin, crispy, tangy. A cold appetizer.

Its purpose is singular and specific: moisten the lungs and stop dry coughs. November in Shanghai brings dry, cold air that assaults your respiratory tract. Dry throat, dry nose, scratchy cough, hoarse voice — these are the hallmarks of autumn dryness, and 秋梨膏 is the answer.

You can buy 秋梨膏 in any Shanghai supermarket, convenience store, or pharmacy. Some versions are pure food-grade — just pear and honey. Others contain actual herbal medicine ingredients and are closer to a soft drug than a beverage. Check the label — or just ask the shopkeeper. They'll know the difference.

I'm going to give you five "cheat codes" — five patterns to look for on any Chinese menu that will tell you the kitchen is doing medical work.[cite: 2]`

    title: "Cheat Code 1: Read the soup names",
    content: `If a soup has an ingredient you recognize from today — 红枣, 枸杞, 山药, 莲子, 桂圆, 百合, 银耳 — it's a food therapy soup. Period. Chinese people don't put goji berries in chicken soup because goji berries taste amazing in chicken soup. They taste fine. They're there because they nourish the liver and brighten the eyes. The flavor is the vehicle. The therapy is the passenger.

Example: 乌鸡枸杞红枣汤 — Black chicken, goji berry, and red date soup. That's not just a soup. That's a blood-nourishing, kidney-tonifying, eye-brightening formula in a bowl. The black chicken (乌鸡) is itself a medicinal food — classified as warm, sweet, and nourishing to the liver and kidneys.[cite: 2]`

    content: `Good Chinese restaurants rotate their menu with the seasons. If there's a section labeled 时令菜 (seasonal dishes) or 当季推荐 (current season recommendations), look there first. These dishes are selected because the ingredients are at their peak AND because they're appropriate for the current season's climate. The chef is being a food therapist without calling themselves one.

In May, seasonal specials will lean cool and light: spring greens, fresh bamboo shoots, river shrimp, light stir-fries. In November, they'll lean warm and rich: braised meats, root vegetable soups, slow-cooked stews. The kitchen is following the same 春生夏长秋收冬藏 principle we've been discussing all day.[cite: 2]`

  {
    title: "Cheat Code 3: Notice the cold/hot dish structure",
    content: `Chinese restaurant menus are usually divided into 凉菜 (cold dishes) and 热菜 (hot dishes). A proper Chinese meal starts with a few cold dishes as appetizers, then moves to hot dishes. This isn't random — it's a mini food therapy protocol:

Cold dishes first: they "open" the stomach, stimulate appetite, and provide a light, cooling start. Many cold dishes feature vinegar, which is sour — and sour "astringes" and generates digestive fluids, preparing the stomach for the heavier food to come.

Hot dishes after: they deliver the main nourishment — warm, substantial, satisfying.

It's a progression: open, prepare, deliver. Appetizer as medicine, main course as nourishment. The structure of the meal IS the therapy.[cite: 2]`

    title: "Cheat Code 4: Spot the keywords",

去火 or 降火 — "Reduce fire." Any dish or drink described as "去火" is designed to cool internal heat. You'll see this on herbal tea shops (凉茶铺), on mung bean soup labels, on chrysanthemum tea bottles. If you've been eating too much fried food, too much Sichuan hotpot, and your throat is sore and your skin is breaking out — look for 去火 options.

滋补 — "Nourishing tonic." Any restaurant or dish described as 滋补 is designed to build you up — warm, rich, strengthening. You'll see this on lamb hotpot restaurants, on black chicken soup restaurants, on herbal soup kitchens. November is 滋补 season. May is NOT.

If you eat 滋补 food in May when it's already getting warm, you might overheat. If you eat 去火 food in November when it's cold, you might make yourself colder. Matching the keyword to the season is food therapy 101.[cite: 2]`

In May: you'll see people drinking 菊花茶 (chrysanthemum tea), 金银花茶 (honeysuckle tea), 绿豆汤 (mung bean soup), 酸梅汤 (sour plum drink). All cool or cold in nature. All clearing heat.

In November: you'll see 姜茶 (ginger tea), 红枣桂圆茶 (red date longan tea), 枸杞茶 (goji tea), and hot 豆浆 (soy milk). All warm or neutral. All nourishing.

Nobody announces this. Nobody reads a food therapy textbook before choosing their afternoon drink. It's instinct — cultural muscle memory trained over generations. A Shanghainese office worker reaching for chrysanthemum tea on a hot May afternoon isn't "practicing Chinese medicine." They're just thirsty. But the choice they make, without thinking, is medically consistent with the system we've been studying all day. The food therapy isn't in the conscious decision. It's in the culture.[cite: 2]`

    title: "Conclusion",
    content: `Here's what I hope you take home from this exhibit — not from this room, but from China:

Next time you sit down in a Chinese restaurant and the waiter brings you a pot of chrysanthemum tea before you've even ordered — that's food therapy.

Next time your Chinese friend sees you coughing and disappears for ten minutes and comes back with a pear boiled with rock sugar — that's food therapy.

Next time the auntie at the breakfast shop tells you "天冷了多吃点姜" — "it's cold, eat more ginger" — that's food therapy.

It's not in a hospital. It's not in a prescription. It's in the kitchen. It's in the thermos. It's in the street vendor's cart. It's in the instinct of a grandmother who has never read a medical textbook but knows exactly what soup to make when her grandson has a cough in November.

That instinct is two thousand years old. And it's in every bowl.

Enjoy your dinner tonight. And pay attention to what's in it.[cite: 2]`

const listContainer = document.getElementById('exhibitList');
const searchBox = document.getElementById('searchBox');

function renderList(dataToRender) {
  listContainer.innerHTML = '';
  if (dataToRender.length === 0) {
    listContainer.innerHTML = '<div class="empty">No results found</div>';
    return;
  }
  
  dataToRender.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-header" onclick="this.parentElement.classList.toggle('active')">
        <span>${item.title}</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="item-content">
        <div class="text-box">${item.content}</div>
      </div>
    `;
    listContainer.appendChild(el);
  });
}

function filterList() {
  const query = searchBox.value.toLowerCase().trim();
  if (!query) {
    renderList(database);
    return;
  }
  
  const filtered = database.filter(item => 
    item.title.toLowerCase().includes(query) || 
    item.content.toLowerCase().includes(query)
  );
  
  renderList(filtered);
  
  // Expand filtered results automatically for easier reading
  setTimeout(() => {
    document.querySelectorAll('.item').forEach(card => card.classList.add('active'));
  }, 10);
}

// Initial render
renderList(database);
</script>
