    content: `Step through this doorway, and you're stepping back about 200 years. What you're looking at is a recreation of a traditional Chinese pharmacy — 药铺 or 药堂. Not a modern hospital pharmacy with fluorescent lights and plastic pill bottles. This is where Chinese medicine lived for most of its history: in shops on busy streets, sandwiched between a tea house and a noodle restaurant, run by families who passed the business down generation after generation.

Notice the signboard. Traditional Chinese pharmacies always had a name — and the name mattered enormously. You might see names like 同仁堂 (Tong Ren Tang — "Hall of Shared Benevolence"), or 胡庆余堂 (Hu Qing Yu Tang — "Hall of Hu's Celebrating Surplus"), or 九芝堂 ("Hall of Nine Lingzhi"). These aren't just business names. They're moral declarations.

同仁堂's founding motto — carved into the shop and memorized by every apprentice — was: "炮制虽繁必不敢省人工，品味虽贵必不敢减物力" — "Though processing is complex, we dare not cut corners on labor; though ingredients are costly, we dare not reduce quality." That motto is from 1706. Three hundred and twenty years later, 同仁堂 is still in business. Still using the same motto. Still operating pharmacies across China and in dozens of countries worldwide.

The point is: a traditional pharmacy wasn't just a shop. It was a brand built on trust. When your product is something people put inside their bodies to treat illness, reputation is everything. One batch of bad medicine, one substitution of a cheap ingredient, and your family's name — your 堂号 — is ruined for generations. In a world with no FDA, no government inspections, no laboratory testing — the pharmacy's name on the door was the quality control system.[cite: 5]`

炒黄 — "Fry until yellow." Gentle heat, just enough to slightly change the color and make the herb more fragrant. This moderates harsh properties without fundamentally changing the herb. Think: lightly toasted bread versus raw bread. Same ingredients, but the texture, flavor, and digestibility are different.

厚片 — Thick slices. For softer, lighter materials that would disintegrate if sliced too thin. You need enough structural integrity to survive 40 minutes of boiling without turning to mush.

段 — Sections/segments. For stems and long thin materials like 麻黄 (ephedra) or 荆芥 (schizonepeta). Cut into 1-2 centimeter segments. This standardizes the size for even extraction.

丝 — Shreds/slivers. For leaves and thin materials. Cutting into fine shreds increases surface area dramatically.

  {
    title: "The Decoction Room (煎药室)",
    content: `This is the 煎药室 — the decoction room. And this is where all of the processing, cutting, and prescribing comes together in one final act: boiling the herbs in water to create the liquid medicine that the patient actually drinks. This liquid is called 汤剂 — literally "soup medicine" — and it's been the primary delivery format for Chinese medicine for about 2,000 years.

The pharmacist in the front shop already told the patient how to do this at home, but many pharmacies — especially modern ones — now offer to decoct the medicine for you. What you see here is the in-house decoction service.

Let's start with the traditional method. See these 砂锅 — clay pots, ceramic vessels, brown and unglazed? Clay and ceramic are the traditional material of choice because they're chemically inert — they don't react with the herb compounds. Iron pots can react with tannins and turn the medicine black. Copper can catalyze oxidation of certain compounds. Aluminum is reactive with acids. So clay it is.

The process follows a strict sequence:

Step 1 — Soak. Cold water is added until it covers the herbs by about 3-5 centimeters. The herbs sit for 30 minutes. This is not optional — dry plant material needs time to rehydrate. If you skip this step and go straight to heating, the surface cells cook and seal before water penetrates the interior, and you get poor extraction. Think of it like cooking dried beans — you always soak first.

Step 2 — First boil (头煎). Bring to a rolling boil on high heat — 武火, "martial fire," strong and aggressive. Once boiling, immediately reduce to low heat — 文火, "civil fire," gentle and sustained. Then simmer.

Here's where the doctor's instructions matter: for a 解表剂 — a formula that "releases the exterior" to treat early-stage colds — simmer only 15-20 minutes. Short and intense. You want the volatile, aromatic compounds that disperse quickly. Boil too long, and those compounds evaporate and you're left with nothing useful.

For a 补益剂 — a tonic formula for chronic weakness — simmer 40-60 minutes. Slow and patient. You want the deep, structural compounds — polysaccharides, saponins, alkaloids — that take longer to dissolve. Quick boiling won't extract them fully.

See how the cooking time is itself part of the prescription? The doctor doesn't just choose the herbs. The doctor chooses the extraction protocol. Fast extraction for fast-acting surface medicines. Slow extraction for deep-acting tonic medicines.

Step 3 — Strain. Pour the liquid through a strainer into a bowl. Press the herb residue to squeeze out remaining liquid. This first extraction is called 头煎.

Step 4 — Second boil (二煎). Add fresh water to the same herbs and boil again, usually for a slightly shorter time. The first extraction captures the most readily soluble compounds. The second extraction gets the stubbornly embedded ones. Some modern pharmacological studies have confirmed this makes sense — certain compounds genuinely do extract better in the second boil because the first boil has broken down cell walls and opened up the plant tissue structure.

Step 5 — Combine. Mix the liquid from the first and second boils together, then divide into two equal portions: morning dose and evening dose. Total liquid per dose is usually about 150-200 milliliters — roughly one small cup. It's concentrated. It's intense. And — I won't lie — most of the time, it tastes terrible.

const listContainer = document.getElementById('exhibitList');
const searchBox = document.getElementById('searchBox');

function renderList(dataToRender) {
  listContainer.innerHTML = '';
  if (dataToRender.length === 0) {
    listContainer.innerHTML = '<div class="empty">No results found</div>';
    return;
  }
  
  dataToRender.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-header" onclick="this.parentElement.classList.toggle('active')">
        <span>${item.title}</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="item-content">
        <div class="text-box">${item.content}</div>
      </div>
    `;
    listContainer.appendChild(el);
  });
}

function filterList() {
  const query = searchBox.value.toLowerCase().trim();
  if (!query) {
    renderList(database);
    return;
  }
  
  const filtered = database.filter(item => 
    item.title.toLowerCase().includes(query) || 
    item.content.toLowerCase().includes(query)
  );
  
  renderList(filtered);
  
  setTimeout(() => {
    document.querySelectorAll('.item').forEach(card => card.classList.add('active'));
  }, 10);
}

renderList(database);
</script>
