But I want you to notice something about the leaf shape. Those spines are serious. Try touching the tip of one — carefully. Sharp, right? In Chinese folk belief, this plant was placed near doorways to ward off evil spirits, because the spiny leaves would prick ghosts and scare them away. The Western tradition of hanging holly on your door at Christmas? Also originally about warding off evil spirits and bad luck. Two cultures, eight thousand miles apart, looked at the same type of spiny-leaved plant and had the same idea: "This will protect my house."

That's either a remarkable coincidence, or there's something about sharp-leaved plants that universally says "don't mess with me" to the human brain. Either way — it's a great dinner party story.

So in this section, we had a fruit tree that blooms in winter and fruits in spring, a mulberry that's four medicines in one, a living dinosaur that became a German prescription drug, a quiet yew that saved millions from cancer, and a holly that scares ghosts on two different continents.

Let's take a quick water break, and then we'll go meet some of the famous names you heard in yesterday's lecture — the celebrity herbs.[cite: 3]`

  {
    title: "Zone 4: Astragalus",
    content: `Right next to the king of tonics — meet the people's champion. If ginseng is the expensive celebrity, this next plant is the hardworking everyday hero.

黄芪, Astragalus. Look at the leaves — they're compound, meaning each leaf is actually made up of many small, oval leaflets arranged along a central stem, like a feather. Typically 12 to 18 pairs of tiny leaflets. If you see flowers — and in May you might see the early buds — they'll be small, yellow, butterfly-shaped. That butterfly shape tells you it's in the legume family — same family as beans, peas, and peanuts.

Now, yesterday we talked about 黄芪 when we discussed the medicinal diet lecture. Remember 黄芪炖鸡 — Astragalus Chicken Soup? This is that herb. In Chinese households, 黄芪 is probably the most commonly used tonic herb — way more common than ginseng, because it's much cheaper, much milder, and much harder to overdose on. If ginseng is a strong espresso, 黄芪 is a gentle green tea. Both give you energy, but one is intense and the other is something you can have every day.

The part used is the root — and when you see it in a Chinese pharmacy, it's been sliced into thin, flat, yellowish-white discs. The name 黄芪 literally means "yellow leader" — 黄 is yellow, referring to the root's color, and 芪 relates to its status as a chief tonic herb.

Modern research on astragalus has been surprisingly robust. It's one of the most-studied herbs in immunology. Multiple studies have shown that astragalus extracts can modulate immune function — specifically, they seem to help an underperforming immune system work better, without overstimulating it. That nuance — boosting without overstimulating — is actually very hard to achieve with pharmaceutical drugs. It's one of the reasons astragalus has attracted serious interest from Western researchers.[cite: 3]`

    content: `And now — the one herb that shows up in more Chinese formulas than any other. The peacekeeper. The diplomat. The one that plays well with everyone.

    content: `One more celebrity before we leave the VIP section. Look for the low-growing rosette of leaves near the ground — wrinkly, hairy, with a slightly purplish flower stalk if we're lucky.

鲜地黄 — Fresh Rehmannia. Freshly dug, juicy, cold in nature. Used to cool the blood and stop bleeding in acute heat conditions. This is the emergency-room version.

生地黄 — Dried Rehmannia. Sliced and dried. Still cold, but less intensely so. Used to clear heat and nourish 阴 — the cooling, moistening aspect of the body. This is the general practitioner version.

  {
    title: "Zone 5: Japanese Knotweed",
    content: `OK, so far everything has felt pretty exotic, right? Ancient Chinese legends, mysterious underground roots, herbs you've never heard of. This next section is going to flip that. These plants? You know them. Or at least, you think you do. Turns out they've been living double lives.

OK, raise your hand if you've ever heard of Japanese Knotweed.

For those of you who raised your hands — you probably know it as a nightmare. An invasive species that destroys foundations, cracks through asphalt, lowers property values, and is basically illegal to have on your property in the UK. British mortgage lenders will literally refuse to approve a home loan if there's knotweed within seven meters of the house. There are entire TV shows about people's knotweed horror stories.

Well — meet the villain.

Look at the stem. See the reddish-purple speckles? Those spots on a green stem — that's your instant ID. The pattern looks a bit like a leopard or a tiger's markings, which is exactly where the Chinese name comes from: 虎杖 means "Tiger Cane" — 虎 is tiger, 杖 is walking stick. Tiger-spotted walking stick.

The stems are hollow — snap one gently and you'll see — with distinct nodes that make it look like bamboo. The leaves are broad, shield-shaped, with a flat base. And the plant is TALL — it can grow several meters high in a single season. That aggressive growth is exactly why it terrorizes European and American gardens.

But here's the plot twist: in China, this plant has been used as medicine for over two thousand years. It's in the classic herbal texts. Nobody here panics about knotweed. Why? Because in its native ecosystem, it has natural competitors — insects, fungi, other plants — that keep it in check. It only becomes a monster when you transplant it to a new continent with no natural enemies.

Medicinally, 虎杖 is used to clear heat, resolve toxins, invigorate blood circulation, and — here's the modern kicker — it's one of the richest natural sources of resveratrol. Yes, that resveratrol. The compound that made red wine famous in the 1990s. "A glass of red wine a day is good for your heart" — remember that? The molecule behind that claim is found in high concentrations in this plant that British homeowners spend thousands of pounds trying to eradicate.

So the next time someone tells you knotweed is worthless — you can tell them it's a traditional Chinese medicine rich in one of the most-hyped antioxidants of the 21st century. It just has... boundary issues when it travels abroad.[cite: 3]`

    content: `Look down at the ground here. See those little red fruits? Careful — I know what you're thinking. But think again.

  {
    title: "Zone 5: Self-Heal",
    content: `Here's a plant with a name that tells you exactly what it does — at least, what it does visually. Look at these purple flower spikes.

See the dense clusters of small purple-blue flowers, packed tightly into a stubby spike at the top of each stem? The individual flowers are hooded, like tiny mouths — that's another member of the mint family, by the way. Square stem? Check.

Now, in English this plant is called Self-Heal, because European herbalists used it for wound healing — they believed that if you pressed the leaves onto a cut, it would "self-heal" the wound. Its Latin name is Prunella vulgaris — and the vulgaris part means "common." So even Western science is telling you: this plant is everywhere.

But the Chinese name is far more poetic: 夏枯草 — "Summer Wither Herb." Here's why: right now, in May, you're seeing it at its peak — green, lush, blooming purple. But watch what happens as summer arrives. By the time of the Summer Solstice — late June — the flower spikes will have dried out and turned brown. The rest of the garden is still green and thriving. The summer heat is at full blast. And this one plant just... gives up. Withers. Dries out. Dies back.

Why? Chinese medicine theory says it's because 夏枯草 is packed with "cold" and "yin" energy. When the yang energy of summer peaks at the Solstice, this intensely yin plant can't survive in all that yang. It's like an ice cube in July — it just can't hold its form.

And here's the beautiful part: it's precisely when the spike dries out that you harvest it as medicine. The dried flower spike — brown, withered, looking dead — IS the medicinal product. You might see it in a Chinese pharmacy and think "that looks like garbage." Nope. That's the medicine. Its job is to clear liver fire — a pattern that shows up as red, painful, swollen eyes, headaches, irritability, high blood pressure.

So remember this the next time you think something is "past its prime" or "dried up" — sometimes that's exactly when it becomes most useful.

And if you come back here in November, you'll see the proof: the spike will be completely brown and dry. And that's exactly what the pharmacist wants.[cite: 3]`

    title: "Zone 5: Burdock",
    content: `One more in our "plants that crossed borders" section. See that plant over there with the enormous leaves? Those things are almost the size of elephant ears.

This is 牛蒡, burdock. The leaves are your first clue: huge, heart-shaped, with a woolly-fuzzy underside — some of the biggest leaves in this garden. The plant can grow taller than you. In May, it's mostly leaves and thick stems, but later in summer you'll see purple thistle-like flower heads.

Now — burdock root is a major ingredient in Japanese cuisine. If you've ever eaten 金平ごぼう (kinpira gobō) — those thin, crunchy, stir-fried root strips in a Japanese restaurant — that's burdock root. In Japan, people eat it the way Americans eat carrots. It's completely normal, everyday food.

In Chinese medicine, different parts are used: the seed — called 牛蒡子 — is more commonly used than the root. The seed is cold and pungent, used to soothe sore throats, reduce swelling, and push out skin rashes. When you have measles or a rash that should be coming out but seems stuck, 牛蒡子 helps "push it to the surface." Remember the elevator concept? The pungent flavor floats things upward and outward. That's what burdock seed does — it takes what's trapped inside and pushes it out through the skin.

But here's my favorite burdock fact, and it has nothing to do with medicine: In 1941, a Swiss engineer named George de Mestral went for a walk with his dog. When they got home, the dog was covered in burrs — seed pods from burdock — that were stuck to its fur. De Mestral looked at the burrs under a microscope, saw tiny hooks that grabbed onto tiny loops of fur, and thought: "I can make something out of this."

He invented Velcro.

So every time you use a Velcro strap — your shoes, your backpack, your laptop cable organizer — you're using technology that a burdock plant invented a few hundred million years before us. Nature's engineering, borrowed by humans. If that's not a reason to respect plants, I don't know what is.

So what did this section teach us? That Chinese medicine isn't locked away in some exotic, distant world. Knotweed is in your neighbor's yard. Plantain is in sidewalk cracks in Manhattan. Burdock invented Velcro. Self-heal grows on every continent. These plants are already in your world — you just didn't know they had medical resumes.

Last section. Follow me.[cite: 3]`

  {
    title: "Zone 6: Lotus",
    content: `We're heading toward the water now. In Chinese culture, water gardens aren't just pretty — they carry a whole philosophical tradition. Confucius said, "The wise find joy in water." And some of the most important medicinal plants in the pharmacopoeia grow in, on, or near water. Let's go see.

And here it is — the plant that might represent Chinese culture more than any other single living thing.

You can't miss it. Those huge, perfectly round leaves rising above the water on long stems — some as wide as a dinner table. They look like green satellite dishes pointing at the sky. In May, the flowers haven't opened yet — those come in July and August, the famous pink and white lotus blossoms you've seen in every piece of Asian art ever. But even without the flowers, the leaves alone are spectacular.

Now, do something for me. If you can reach a leaf, pour a little water on it — from your water bottle, anything.

See that? The water doesn't spread out. It beads up into perfect silver spheres and rolls right off the surface. The leaf is completely waterproof. This is called the "lotus effect" — and it's a real scientific phenomenon. The leaf surface is covered in microscopic bumps coated with waxy crystals that make it ultra-hydrophobic. Water can't stick. And as the water rolls off, it picks up dirt particles and carries them away. The leaf is self-cleaning.

This property has inspired real nanotechnology. Self-cleaning paints, water-repellent coatings, anti-fingerprint screens — all inspired by this leaf. Engineers call them "lotus-effect surfaces." So this leaf is basically a nano-engineering blueprint that's been growing in ponds for millions of years.

But we're here for the medicine. And lotus is the ultimate "one plant, many medicines" story. Mulberry gave us four. Lotus gives us at least SIX:

荷叶 — the leaf. Clears summer heat and lifts the yang energy upward. It's also used to wrap food — lotus-leaf-wrapped sticky rice is a classic dim sum dish. Medicine AND packaging.

莲子 — the seed. Calms the spirit, strengthens the spleen, stops diarrhea. It's a key ingredient in 四神汤 — the "Four Spirits Soup" we discussed in the medicinal diet lecture.

莲子心 — the tiny green embryo inside the seed. Extremely bitter. Used specifically to clear heat from the heart and calm anxiety. You can brew it as a tea — about a dozen of these tiny green threads in hot water. It tastes awful. It works.

莲藕 — the root, the rhizome under the mud. Sliced lotus root is a common vegetable in Chinese cooking — crunchy, sweet, full of holes. Raw lotus root cools the blood and stops bleeding. Cooked lotus root warms the spleen and nourishes blood. Raw = cool. Cooked = warm. Same root, different preparation, different function. Sound familiar? It's the processing principle again.

莲房 — the seed pod, that shower-head-shaped structure you see when the petals fall off. Used to stop uterine bleeding.

藕节 — the nodes of the rhizome, the knobby joints between sections of lotus root. Specifically used as a hemostatic — to stop bleeding.

Six parts, six medicines. And we haven't even mentioned that the flower itself is the supreme symbol of Buddhism — "rising from the mud, unstained" — representing spiritual purity emerging from the messiness of the material world.

So when you look at this pond, you're not just looking at a pretty water garden. You're looking at a pharmacy, a nano-engineering lab, a dim sum kitchen, and a Buddhist scripture, all growing from the same mud.[cite: 3]`
  },
  {
    title: "Zone 6: Fox Nut / Gorgon Fruit",
    content: `See those other large leaves on the water surface — the ones that look different from lotus? More crinkled, with visible veins, almost like wrinkled green fabric?

This is 芡实, also called 鸡头米 — "Chicken Head Rice." Why that name? Because later in summer, the fruit that emerges from the water has a pointed, beaked top that looks almost exactly like a chicken's head poking above the surface. It's one of the best plant names in China — completely ridiculous and completely accurate.

Right now in May, you'll mainly see the leaves. They're big and round like lotus leaves, but the surface is puckered, wrinkled, and — look carefully — covered in small spines. The underside is often deep purple. So if you see a big floating leaf that looks like it's been left in the bathtub too long AND has tiny thorns — that's 芡实.

The edible part is the seed inside the fruit. When you crack open that "chicken head," inside there are round, pearl-white seeds about the size of peas. In Suzhou — about an hour from here — fresh 鸡头米 is a seasonal delicacy in September and October. People line up for it. A small bowl of fresh 鸡头米 in sweet osmanthus syrup is one of the great Suzhou autumn experiences.

Medicinally, 芡实 is a gentle tonic that strengthens the spleen, stops diarrhea, and firms up the kidneys. It's often used alongside lotus seed — the two work beautifully together. In fact, 芡实 is one of the ingredients that some versions of 四神汤 include. Remember the medicinal diet lecture? Lotus seed, Chinese yam, poria, and fox nut — all gentle, all nourishing, all food-grade medicines. This is 药食同源 at its most elegant: a dessert that's also a prescription.[cite: 3]`
  },
  {
    title: "Zone 6: Kalimeris",
    content: `As we walk away from the water, look at this small plant near the path — it's easy to overlook.

Small, daisy-like, with slender leaves and pale purple flower heads — some might still be in bloom, others might have finished. Nothing dramatic. You'd walk past it a hundred times without noticing.

But if I told the Shanghainese people in this group — wait, there aren't any, but if there were — they'd get very excited. Because this is 马兰, and the young leaves of this plant are one of Shanghai's most beloved spring vegetables. 马兰头拌香干 — blanched kalimeris shoots mixed with pressed tofu, sesame oil, and a splash of soy sauce — is a dish that every Shanghainese person associates with springtime. It appears on restaurant menus for about six weeks in March and April, and then it's gone until next year.

So this is a plant that's simultaneously a "weed," a seasonal delicacy, and a traditional medicine — it's used to clear heat and cool the blood, particularly for sore throats and red, swollen eyes.

I mention it here not because it's dramatic, but because it captures something important: most medicinal plants aren't exotic. They aren't rare. They aren't locked away in mountain temples. They're growing on the side of the road, and the local grandma knows exactly which ones to pick, which ones to eat, and which ones to brew into tea when someone in the family has a fever. That grandma knowledge is, in many ways, the real foundation of the entire Chinese medical tradition. The textbooks came later. The grandmas came first.[cite: 3]`
  },
  {
    title: "Zone 6: Stonecrop",
    content: `One quick bonus before we wrap up — look at the ground right here. This low, creeping mat of little fleshy leaves with tiny yellow star-shaped flowers.

This is 垂盆草 — literally "hanging-pot herb," because it drapes over the edges of pots and walls. The leaves are small, thick, succulent-like, usually in groups of three along the stem. And right now in May, it's covered in these cheerful little yellow flowers — five-pointed stars, each one no bigger than your fingernail.

It looks like a houseplant. It looks harmless. It looks like something you'd put in a hanging basket on your porch.

But in Chinese medicine, this humble ground-creeper has a very specific and important job: it protects the liver. 垂盆草 has been extensively studied for its hepatoprotective effects — meaning it helps liver cells survive damage. In China, preparations of this plant have been used clinically for hepatitis — actual hospital-grade treatment for liver inflammation.

The key compound — sarmentosin and related chemicals — has shown legitimate liver-protective activity in pharmacological studies. This isn't folk-medicine speculation; this is the kind of herb that has peer-reviewed papers behind it.

I show you this one last because it makes a point: you cannot judge a medicine by its appearance. This looks like a decorative ground cover you'd buy at a garden center for $3.99. It's actually a liver-saving drug. If ginseng taught you that the important stuff is underground, 垂盆草 teaches you that the important stuff can also be right there in plain sight — you just have to know what you're looking at.[cite: 3]`

Yesterday, in the classroom, I told you about thermostats, and elevators, and subway maps, and orchestras. Those were metaphors to help you understand how Chinese medicine thinks. Today, you saw how Chinese medicine looks — what it looks like when it's alive, when it's growing, when it's flowering and fruiting and climbing and creeping.

I want to leave you with one thought. There are roughly 12,000 documented medicinal plant species in the Chinese pharmacopoeia. We saw... about thirty today. That's a quarter of one percent. And yet even in that tiny sample, you saw patterns repeating over and over:

The same plant can be different medicines depending on which part you use — remember mulberry: leaf, twig, bark, fruit. Four parts, four functions.

The same plant can be different medicines depending on how you process it — remember He Shou Wu: raw is a laxative, processed is a tonic. Remember Rehmannia: fresh, dried, and steamed are three different drugs.

Plants that smell strong tend to DO something strong — mint, perilla, fish herb, stone calamus. The nose knows.

And the line between food and medicine is blurry on purpose — lotus root in your stir-fry, burdock root in your kinpira, goji berries in your smoothie, honeysuckle in your iced tea. 药食同源 — medicine and food, same origin. You've been interacting with Chinese medicine your whole life. You just didn't have the vocabulary for it until now.

So the next time you're walking through a park back home — in Boston, in London, in Sydney, wherever — and you see plantain growing in a sidewalk crack, or mint in someone's garden, or honeysuckle climbing a fence... maybe give it a second look. Maybe even say hello. After all, you've been formally introduced now.

Thank you. And please don't eat the ginkgo seeds without cooking them first.[cite: 3]`

const listContainer = document.getElementById('exhibitList');
const searchBox = document.getElementById('searchBox');

function renderList(dataToRender) {
  listContainer.innerHTML = '';
  if (dataToRender.length === 0) {
    listContainer.innerHTML = '<div class="empty">No results found</div>';
    return;
  }
  
  dataToRender.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-header" onclick="this.parentElement.classList.toggle('active')">
        <span>${item.title}</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="item-content">
        <div class="text-box">${item.content}</div>
      </div>
    `;
    listContainer.appendChild(el);
  });
}

function filterList() {
  const query = searchBox.value.toLowerCase().trim();
  if (!query) {
    renderList(database);
    return;
  }
  
  const filtered = database.filter(item => 
    item.title.toLowerCase().includes(query) || 
    item.content.toLowerCase().includes(query)
  );
  
  renderList(filtered);
  
  // Expand filtered results automatically for easier reading
  setTimeout(() => {
    document.querySelectorAll('.item').forEach(card => card.classList.add('active'));
  }, 10);
}

// Initial render
renderList(database);
</script>
