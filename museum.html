What is NOT debated: the demand for rhino horn drove rhinoceros populations to the brink of extinction. The Javan rhino, the Sumatran rhino — functionally gone from the wild, or nearly so. Poaching remains a catastrophic problem in Africa despite international bans.

China banned rhino horn in 1993 and replaced it in all official formulas with 水牛角 — water buffalo horn. Water buffalo are domestic farm animals, abundant, not endangered. Whether the substitution is medically equivalent is debated, but the conservation impact is clear: the legal Chinese market for rhino horn is closed.

It is EXTREMELY potent. If you touched this and then rubbed your eyes, you'd be in the emergency room. If you ingested even a small amount without proper medical preparation, you could go into cardiac arrest. This is one of the most dangerous substances in the Chinese pharmacy.

So why is it here? Because in precisely controlled doses, it's a heart medicine. 蟾酥 contains bufalin and related compounds called bufadienolides — and these are chemically very similar to digoxin, the famous Western heart drug derived from foxglove (Digitalis). Both substances strengthen heart contractions in failing hearts. Both are lethal in overdose. Both require extreme dosing precision.

蟾酥 is a key ingredient in 六神丸 — "Six-Spirit Pill" — one of the most widely used traditional pills for sore throat and heart palpitations. The pill is tiny — about the size of a grain of rice — precisely BECAUSE the dose must be tiny. A few pills: medicine. A handful: death.

The parallel between toad venom (Chinese) and foxglove (European) is one of the most striking in the history of medicine. Two completely different cultures, two completely different organisms — an amphibian and a flower — producing nearly identical cardiac-active molecules. And both traditions figuring out that the same compound can save a heart or stop it, depending entirely on the dose.

And biochemically? The placenta IS rich in hormones, growth factors, iron, and proteins. It's not crazy to think it has bioactive properties. In fact, "placentophagy" — eating the placenta — exists in many mammalian species. Dogs, cats, horses, and most other mammals eat the placenta after giving birth. Some advocates in the modern Western wellness movement have promoted human placenta consumption — dried, encapsulated, and sold as postpartum supplements. The practice is controversial in both Chinese and Western contexts.

In 2020, 紫河车 was removed from the Chinese Pharmacopoeia. The stated reasons were ethical — concerns about consent (whose placenta is this? did the mother agree?), hygiene (risk of transmitting infections including HIV and hepatitis), and moral discomfort with commercializing human tissue.

Deep, pure, blazing red. Like fresh blood on snow. This is 朱砂 — cinnabar — and it's been the most important red pigment in Chinese civilization for over 3,000 years. The Forbidden City's red walls? Cinnabar. The red ink that emperors used to write comments on official documents — called 朱批, "vermillion comments"? Cinnabar. The red lacquer on ancient Chinese furniture? Cinnabar. The paint on the faces of opera performers? Cinnabar. This one mineral colored an entire civilization.

In Chinese medicine, cinnabar is used to calm the mind and stop palpitations. When someone can't sleep because their heart is racing, their thoughts are spinning, they feel anxious and restless — cinnabar is the traditional "heavy anchor" that pulls the mind downward and quiets it. The Chinese term is 重镇安神 — "settle by weight." The idea is almost physical: your mind is floating upward like a balloon, and cinnabar is the heavy stone tied to the string that brings it back down.

Now — the chemistry. Cinnabar is mercury sulfide. HgS. It contains mercury. The same mercury that your dentist stopped putting in fillings. The same mercury that makes thermometers dangerous if they break. Mercury.

Is this safe? Here's the nuanced answer: cinnabar in its mineral sulfide form (HgS) is relatively insoluble in water and in stomach acid. This means that when you swallow a small amount of cinnabar powder, very little mercury actually enters your bloodstream. It mostly passes through. This is VERY different from organic mercury compounds — like methylmercury in contaminated fish — which are highly absorbable and highly toxic. Traditional practitioners argue that cinnabar at traditional doses, for short periods, has an acceptable safety profile precisely because of this low bioavailability.

Modern regulators are less comfortable. Many countries have restricted or banned cinnabar in internal medicines. China still permits it in certain traditional formulas at controlled doses, but with warnings.

The Taoist connection is irresistible: for centuries, Taoist alchemists believed that cinnabar was the key to immortality. They heated it in furnaces, producing liquid mercury (which they called "living silver"), and combined it with other substances in attempts to create the "elixir of eternal life." Multiple Chinese emperors died from consuming these mercury-based "immortality pills." They were literally poisoning themselves in pursuit of eternal life. The most famous case: Emperor Qin Shi Huang — the first emperor of unified China, builder of the Great Wall, commander of the Terracotta Army — is widely believed to have died from mercury poisoning caused by his alchemists' elixirs.

These grayish-white, chalky fragments are labeled 龙骨 — "Dragon Bone." And for centuries, traditional pharmacists bought them, ground them into powder, and prescribed them for anxiety, insomnia, palpitations, and seizures. The medicine was classified as "heavy settling" — like cinnabar, the idea was that these heavy mineral fragments would weigh down the restless spirit and calm the mind.

Those fragments turned out to be oracle bones — 甲骨文 — dating to the Shang Dynasty, roughly 1200 to 1050 BC. Over three thousand years old. They are the oldest known examples of Chinese writing. The inscriptions are divination records: questions posed to ancestors and gods, with answers interpreted from the cracks produced by heating the bones. They've provided more information about Shang Dynasty culture, religion, politics, and language than any other archaeological source.

The discovery of oracle bones is considered one of the most important archaeological events in Chinese history. It rewrote the timeline of Chinese civilization, confirmed the historical existence of the Shang Dynasty (previously considered semi-legendary), and launched an entirely new academic field.

And it all started because a sick scholar looked at his medicine and thought, "Wait — is that WRITING?"

For who knows how many decades or centuries before 1899, farmers had been digging up priceless archaeological treasures, selling them to pharmacists, and pharmacists had been GRINDING THEM INTO POWDER AND FEEDING THEM TO PATIENTS. Thousands of oracle bones — irreplaceable records of ancient civilization — were consumed as anxiety medicine, dissolved in water, and swallowed. Gone forever.

Amber is fossilized tree resin — not sap, resin. Millions of years ago, a tree oozed sticky resin, an insect landed on it and got stuck, more resin flowed over the insect, and over geological time, the resin hardened into this translucent stone. The insect inside is perfectly preserved — wings, legs, antennae — in a golden time capsule.

In Chinese medicine, amber is ground into powder and used to calm the mind and settle anxiety — same "heavy settling" category as dragon bone and magnetite. It's also used to "invigorate blood" and promote urination. The calming function may have been inspired by the fact that when you hold amber up to light, it glows with this warm, honeyed luminosity that is genuinely soothing to look at.

And amber is also a gem. Amber jewelry has been prized from the Baltic to China for thousands of years. The Amber Room in the Catherine Palace in Russia — an entire room paneled in amber — was called the "Eighth Wonder of the World" before it was looted by the Nazis in World War II and disappeared. So amber is a fossil, a gem, a missing art treasure, a movie plot device, AND a Chinese sedative. For a blob of ancient tree sap, that's an impressive CV.[cite: 1]`

This branching, white-to-pink structure is 珊瑚 — coral. Calcium carbonate skeleton of marine coral animals. Used traditionally to calm convulsions and clear the eyes. Now, of course, coral reefs are among the most endangered ecosystems on Earth — bleaching, acidification, warming oceans. Medicinal use of coral has essentially stopped in mainstream Chinese pharmacy. Tibetan medicine still values it. This specimen stays here as a reminder that the ocean's pharmacy, like the forest's pharmacy, has limits. When the ecosystem dies, the medicine dies with it.

M17：钟乳石 — Stalactite
This elongated, cone-shaped mineral — dripping with frozen-in-time layers of calcium carbonate — is 钟乳石, a stalactite. Yes, the kind that hangs from cave ceilings. It forms one drop at a time: mineral-rich water drips from a cave roof, the water evaporates, a microscopic layer of calcium carbonate is left behind. Repeat for 100,000 years. You get this.

In Chinese medicine, stalactite is warmed and used to warm the lungs — chronic cold-type asthma, cold hands and feet, impotence from kidney yang deficiency. There's a poetic logic: a mineral formed by slow accumulation over millennia is prescribed for conditions of slow, chronic depletion. The medicine's timescale matches the disease's timescale. Deep medicine for deep problems.

But here's the conservation note: stalactites take hundreds of thousands of years to form. Breaking one off for medicine is permanent — it will never regrow in any human-relevant timeframe. Many Chinese caves now prohibit harvesting. This specimen is from a time before those protections existed.

M18：花蕊石 — Ophicalcite
This stone — look at the pattern. See those swirling veins of green and white? Like marble that's been mixed with jade. The name 花蕊石 means "flower-stamen stone" because the patterns resemble flower stamens frozen in rock.

It's a metamorphic rock — limestone that's been transformed by heat and pressure, with serpentine minerals creating those green veins. Medicinally, it's used to stop bleeding and dissolve blood clots — a wound medicine for traumatic injuries. The traditional preparation involves calcining it — heating to extreme temperatures — then quenching it, grinding it, and applying it to wounds or taking it internally for internal bleeding.

Honestly, I include this one mostly because it's beautiful. Sometimes a medicine's first job is to make you stop and look.

M19：寒水石 — Calcite / "Cold Water Stone"
This pale, cool-to-the-touch mineral is 寒水石 — and the name tells you everything: "Cold Water Stone." Feel it.

Cool, right? Even at room temperature, calcite and gypsum-type minerals feel cooler than the air. That's because of their thermal conductivity — they pull heat from your skin faster than wood or plastic do. And that cooling sensation is exactly why it's in the pharmacopoeia: it clears heat. When a patient has a raging fever and feels like they're burning, this stone's nature is to be cold. Cold stone cools hot body. The principle could not be simpler.

Sometimes Chinese medicine is profoundly complex. And sometimes it's just: "this rock feels cold, so let's use it to cool things down." Both approaches coexist. And both work.

M20：禹余粮 — Limonite / "Yu's Leftover Grain"
Last one. And the name is a legend.

禹余粮 — "Yu's Leftover Grain." 禹 is the Great Yu — the mythical founder of the Xia Dynasty, the legendary hero who tamed China's great floods about 4,000 years ago. According to the story, Yu worked so tirelessly to control the floods — digging channels, building levees, redirecting rivers — that he passed by his own home three times without stopping to go inside and see his family. He ate only simple food and slept on bare ground.

The legend says that when Yu finished his work and the floods were controlled, some of his rations were left behind — leftover grain turned to stone over the ages. THAT, according to folk tradition, is what this yellowish-brown mineral is: the fossilized remnants of the Great Yu's lunch.

In reality, it's limonite — a hydrated iron oxide mineral. Not ancient food. But the name stuck, because it's a great story, and because the mineral does look remarkably like a lumpy, compressed ball of ancient grain.

Medicinally, 禹余粮 is used to stop chronic diarrhea — specifically the kind that's been going on for weeks or months and won't respond to anything else. It's astringent and binding. It tightens the intestines and stops the leaking.

I saved this one for last because it captures something essential about Chinese medicine: even a rock has a story. Even a lump of iron oxide gets a legend, a name with meaning, a connection to mythology and history. In Chinese medicine, nothing is "just a chemical." Everything is embedded in a web of stories, metaphors, and cultural memory. The medicine works on the body. The story works on the mind. And the best doctors have always known that you need both.[cite: 1]`

const listContainer = document.getElementById('exhibitList');
const searchBox = document.getElementById('searchBox');

function renderList(dataToRender) {
  listContainer.innerHTML = '';
  if (dataToRender.length === 0) {
    listContainer.innerHTML = '<div class="empty">No results found</div>';
    return;
  }
  
  dataToRender.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-header" onclick="this.parentElement.classList.toggle('active')">
        <span>${item.title}</span>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="item-content">
        <div class="text-box">${item.content}</div>
      </div>
    `;
    listContainer.appendChild(el);
  });
}

function filterList() {
  const query = searchBox.value.toLowerCase().trim();
  if (!query) {
    renderList(database);
    return;
  }
  
  const filtered = database.filter(item => 
    item.title.toLowerCase().includes(query) || 
    item.content.toLowerCase().includes(query)
  );
  
  renderList(filtered);
  
  // Expand filtered results automatically for easier reading
  setTimeout(() => {
    document.querySelectorAll('.item').forEach(card => card.classList.add('active'));
  }, 10);
}

// Initial render
renderList(database);
</script>
